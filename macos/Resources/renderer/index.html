<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'none'; connect-src 'none'"><link rel="stylesheet" href="katex/katex.min.css"><style>body{font:17px -apple-system,sans-serif;padding:14px;line-height:1.7;overflow-wrap:anywhere;color:#303747;background:white}pre{white-space:pre-wrap;background:#f3f4f6;padding:12px} .katex-display{overflow-x:auto;overflow-y:hidden}table{border-collapse:collapse}td,th{border:1px solid #ddd;padding:6px} </style><script src="katex/katex.min.js"></script><script src="marked.js"></script><script src="purify.js"></script></head><body><main id="answer"></main><script>
function mathToken(src,block){let m=block? /^(?:\\\[([\s\S]*?)\\\]|\$\$([\s\S]*?)\$\$)(?:\n|$)/.exec(src): /^(?:\\\(([\s\S]*?)\\\)|\$([^$\n]+?)\$)/.exec(src);if(m)return {type:block?'blockMath':'inlineMath',raw:m[0],text:m[1]??m[2],display:block};}
const mathRender=t=>katex.renderToString(t.text,{displayMode:t.display,throwOnError:false,trust:false,maxExpand:1000});
marked.use({extensions:[{name:'blockMath',level:'block',start:s=>s.search(/\\\[|\$\$/),tokenizer:s=>mathToken(s,true),renderer:mathRender},{name:'inlineMath',level:'inline',start:s=>s.search(/\\\(|\$/),tokenizer:s=>mathToken(s,false),renderer:mathRender}]});
window.renderAnswer=text=>{document.getElementById('answer').innerHTML=DOMPurify.sanitize(marked.parse(text),{ADD_TAGS:['annotation'],ADD_ATTR:['encoding']});};
document.addEventListener('click',e=>{if(e.target.closest('a'))e.preventDefault();});
</script></body></html>
